version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gcs-connector
    main: ./cmd/gcs-connector
    binary: gcs-connector
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: arm

archives:
  - id: gcs-connector
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: desc
  abbrev: 7
  format: >-
    {{ .SHA }} {{ trimprefix (trimprefix (trimprefix (trimprefix (trimprefix .Message "feat: ") "fix: ") "refactor: ") "docs: ") "style: " }}
  filters:
    exclude:
      - "^chore"
      - "^test"
      - "^perf"
      - "^ci"
      - "^build"
      - "^ops"
      - "^docs"
      - "^style"
  groups:
    - title: "Breaking Changes"
      regexp: '(?i)\(BC\)|\bBREAKING CHANGE\b'
      order: 10
    - title: "Experimental Features"
      regexp: '(?i)\(experimental\)'
      order: 25
    - title: "Bug Fixes"
      regexp: '(?i)^fix(\(.+\))?:|\bfix\b'
      order: 30
    - title: "New Features"
      regexp: '(?i)^feat(\(.+\))?:|\badd\b'
      order: 20
    - title: "Refactoring"
      regexp: '(?i)^refactor(\(.+\))?:'
      order: 40
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: larknafets
    name: gcs-connector-evcc
