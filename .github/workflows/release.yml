name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run tests
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hassio:
    name: Update HA Add-on
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gcs-ha-addons
        uses: actions/checkout@v4
        with:
          repository: larknafets/gcs-ha-addons
          token: ${{ secrets.HASSIO_DEPLOY_TOKEN }}
          path: ./hassio

      - name: Update version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -e "s/^version:.*/version: \"${version}\"/" ./hassio/gcs-connector-evcc/config.yaml

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/larknafets/gcs-connector-evcc/releases --paginate | jq -s '
            [.[][] | select(.draft == false and .prerelease == false)]
            | sort_by(.published_at)
            | reverse
            | .[]
            | "## [\(.tag_name)] - \(.published_at | split("T")[0])\n\n\((.body // "No release notes.")
            | gsub("(?m)^\\* [0-9a-f]{40} "; "* "))\n"
          ' -r > /tmp/changelog_entries.md

          printf '%s\n\n' 'Full release details: https://github.com/larknafets/gcs-connector-evcc/releases' > ./hassio/gcs-connector-evcc/CHANGELOG.md
          cat /tmp/changelog_entries.md >> ./hassio/gcs-connector-evcc/CHANGELOG.md

      - name: Push
        run: |
          cd ./hassio
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Mirror gcs-connector-evcc release ${GITHUB_REF_NAME}"
          git push
